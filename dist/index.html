      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    #bb-product-lineup .bb-product {
      border: 1px solid var(--bb-dark);
      border-radius: 34px;
      background: var(--bb-gray);
      box-shadow: 0 5px 0 var(--bb-dark);
      padding: 26px;
      min-height: 270px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: transform .2s ease, background .2s ease;
    }

    #bb-product-lineup .bb-product:nth-child(3n+2) { background: var(--bb-green); }
    #bb-product-lineup .bb-product:nth-child(4n) { background: var(--bb-dark); color: var(--bb-white); }

    #bb-product-lineup .bb-product:hover { transform: translateY(-4px); }
    #bb-product-lineup .bb-product:has([aria-expanded=&quot;true&quot;]) { outline: 3px solid var(--bb-dark); outline-offset: 4px; }
    #bb-product-lineup .bb-products &gt; .bb-detail { grid-column: 1 / -1; margin: 0 0 8px; }
    #bb-product-lineup .bb-product h3 { max-width: 100%; }
    #bb-product-lineup .bb-system-number { position: relative; z-index: 2; max-width: 65%; }
    #bb-product-lineup .bb-nav { flex-wrap: wrap; }
    #bb-product-lineup .bb-product-open { min-height: 48px; }

    #bb-product-lineup .bb-product[hidden] { display: none; }

    #bb-product-lineup .bb-product-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    #bb-product-lineup .bb-product-index {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .72;
    }

    #bb-product-lineup .bb-product-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid currentColor;
      display: grid;
      place-items: center;
      background: var(--bb-white);
      color: var(--bb-dark);
    }

    #bb-product-lineup .bb-product h3 {
      margin: 24px 0 12px;
      max-width: 86%;
      font-size: clamp(25px, 3vw, 36px);
      line-height: 1.03;
      letter-spacing: -.04em;
      font-weight: 500;
    }

    #bb-product-lineup .bb-product p {
      margin: 0;
      max-width: 620px;
      line-height: 1.48;
      font-size: 15px;
    }

    #bb-product-lineup .bb-product-open {
      margin-top: auto;
      padding-top: 22px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      font-weight: 500;
    }

    #bb-product-lineup .bb-product-open span {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--bb-dark);
      color: var(--bb-white);
      transition: transform .18s ease;
    }

    #bb-product-lineup .bb-product:nth-child(4n) .bb-product-open span {
      background: var(--bb-green);
      color: var(--bb-dark);
    }

    #bb-product-lineup .bb-product-open:hover span { transform: translateX(4px); }

    #bb-product-lineup .bb-detail {
      margin-top: 22px;
      border: 1px solid var(--bb-dark);
      border-radius: 38px;
      background: var(--bb-white);
      box-shadow: 0 6px 0 var(--bb-dark);
      padding: 30px;
      display: grid;
      grid-template-columns: .75fr 1.25fr;
      gap: 26px;
    }

    #bb-product-lineup .bb-detail[hidden] { display: none; }

    #bb-product-lineup .bb-detail h3 {
      margin: 10px 0 8px;
      font-size: clamp(28px, 4vw, 45px);
      line-height: 1;
      letter-spacing: -.045em;
      font-weight: 500;
    }

    #bb-product-lineup .bb-detail-outcome {
      margin: 0;
      color: #4b4c55;
      line-height: 1.48;
    }

    #bb-product-lineup .bb-detail-content {
      border-left: 1px solid var(--bb-dark);
      padding-left: 26px;
    }

    #bb-product-lineup .bb-detail-content h4 {
      margin: 0 0 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    #bb-product-lineup .bb-detail-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 9px 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #bb-product-lineup .bb-detail-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.35;
      font-size: 14px;
    }

    #bb-product-lineup .bb-detail-list li:before {
      content: &quot;↗&quot;;
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--bb-green);
      border: 1px solid var(--bb-dark);
      font-size: 11px;
    }

    #bb-product-lineup .bb-client-band {
      margin-top: 60px;
      background: var(--bb-dark);
      color: var(--bb-white);
      border-radius: 45px;
      padding: 34px;
      overflow: hidden;
    }

    #bb-product-lineup .bb-client-band h2 {
      margin: 0 0 10px;
      font-size: clamp(31px, 4vw, 48px);
      line-height: 1;
      letter-spacing: -.045em;
      font-weight: 500;
    }

    #bb-product-lineup .bb-client-band p {
      margin: 0;
      max-width: 730px;
      color: #d8d8dc;
      line-height: 1.5;
    }

    #bb-product-lineup .bb-client-rail {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    #bb-product-lineup .bb-client-rail span {
      color: var(--bb-dark);
      background: var(--bb-green);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 500;
    }

    #bb-product-lineup .bb-manifesto {
      margin-top: 20px;
      border: 1px solid var(--bb-dark);
      border-radius: 45px;
      background: var(--bb-green);
      box-shadow: 0 6px 0 var(--bb-dark);
      padding: 38px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 28px;
      align-items: end;
    }

    #bb-product-lineup .bb-manifesto blockquote {
      margin: 0;
      font-size: clamp(35px, 5vw, 65px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 500;
    }

    #bb-product-lineup .bb-manifesto p {
      margin: 0;
      line-height: 1.5;
      font-size: 16px;
    }

    #bb-product-lineup .bb-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--bb-dark);
      font-size: 13px;
    }

    #bb-product-lineup .bb-footer strong { font-weight: 500; }

    #bb-product-lineup button:focus-visible,
    #bb-product-lineup a:focus-visible {
      outline: 3px solid var(--bb-green);
      outline-offset: 3px;
    }

    @media (max-width: 820px) {
      #bb-product-lineup .bb-hero,
      #bb-product-lineup .bb-section-heading,
      #bb-product-lineup .bb-detail,
      #bb-product-lineup .bb-manifesto {
        grid-template-columns: 1fr;
      }

      #bb-product-lineup .bb-hero { padding-top: 34px; }
      #bb-product-lineup .bb-system-card { min-height: 290px; }
      #bb-product-lineup .bb-section-heading { align-items: start; }
      #bb-product-lineup .bb-section-heading p { max-width: none; }
      #bb-product-lineup .bb-detail-content { border-left: 0; border-top: 1px solid var(--bb-dark); padding-left: 0; padding-top: 22px; }
      #bb-product-lineup .bb-manifesto { align-items: start; }
    }

    @media (max-width: 620px) {
      #bb-product-lineup .bb-shell { padding: 12px 14px 42px; }
      #bb-product-lineup .bb-orb-one { width: 220px; height: 220px; right: 0; top: 138px; opacity: .52; }
      #bb-product-lineup .bb-orb-two { width: 120px; height: 120px; left: 0; }
      #bb-product-lineup .bb-products { grid-template-columns: 1fr; }
      #bb-product-lineup .bb-product { min-height: 245px; border-radius: 28px; }
      #bb-product-lineup .bb-system-card,
      #bb-product-lineup .bb-client-band,
      #bb-product-lineup .bb-manifesto,
      #bb-product-lineup .bb-detail { border-radius: 30px; }
      #bb-product-lineup .bb-detail-list { grid-template-columns: 1fr; }
      #bb-product-lineup .bb-footer { align-items: flex-start; flex-direction: column; }
      #bb-product-lineup .bb-title { font-size: clamp(45px, 17vw, 69px); }
      #bb-product-lineup .bb-system-icon { width: 88px; height: 88px; }

      return;

      tab.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]'),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);

    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {

      list.querySelector('[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]') ??
